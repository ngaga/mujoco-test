name: Mobile manipulation prototype

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libosmesa6-dev libgl1-mesa-dri
          python -m pip install -r requirements.txt numpy imageio
      - name: Syntax and scene compilation
        run: |
          python -m compileall -q mobile_demo tests/test_mobile_demo.py
          python -m mobile_demo.run --check-model
      - name: Interface and physics unit tests
        run: python -m unittest discover -s tests -p 'test_mobile_demo.py' -v
      - name: One-cube real-contact expert rollout
        run: |
          python -m mobile_demo.run --cubes 1 --smoke-test --max-steps 750 \
            --output mobile_runs/one_cube.json --gif mobile_runs/one_cube.gif
      - name: Archive actual rollout (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-physics-prototype
          path: mobile_runs/
          if-no-files-found: ignore