name: Mobile manipulation prototype

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libosmesa6-dev libgl1-mesa-dri
          python -m pip install -r requirements.txt numpy imageio
      - name: Syntax and scene compilation
        run: |
          python -m compileall -q mobile_demo tests/test_mobile_demo.py
          python -m mobile_demo.run --check-model
      - name: Interface and physics unit tests
        run: python -m unittest discover -s tests -p 'test_mobile_demo.py' -v
      - name: Physically induced drop must cause a fresh grasp attempt
        run: |
          python -m mobile_demo.run --cubes 1 --max-steps 650 --max-retries 2 \
            --inject-drop-once --output mobile_runs/recovery.json
          python - <<'PY'
          import json
          r = json.load(open("mobile_runs/recovery.json"))
          assert r["fault_injected"], "fault injection never activated"
          assert r["retries"] >= 1, "robot did not schedule recovery"
          assert r["attempts_per_cube"][0] >= 2, "no second physical grasp attempt"
          assert r["retry_events"], "missing recovery diagnostics"
          assert r["simulation_seconds"] > r["retry_events"][0]["time"] + 1
          assert not r["vla_inference_executed"], "oracle misrepresented as VLA"
          print("OK: drop and genuine non-resetting re-attempt")
          PY
      - name: Experimental full one-cube delivery (known unreliable)
        continue-on-error: true
        run: |
          python -m mobile_demo.run --cubes 1 --smoke-test --max-steps 850 \
            --max-retries 2 --output mobile_runs/one_cube.json \
            --gif mobile_runs/one_cube.gif
      - name: Archive actual rollout (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-physics-prototype
          path: mobile_runs/
          if-no-files-found: ignore