name: MuJoCo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mujoco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: MuJoCo smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MuJoCo 4 and dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q demo.py motion.py vision.py camera_preview.py tests

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile MuJoCo scene
        run: python demo.py --check-model

      - name: Exercise a full simulation cycle
        run: python demo.py --smoke-test

      - name: Boot headless WebViewer and exercise HTTP controls
        run: python tests/viewer_smoke.py
