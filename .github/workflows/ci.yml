name: MuJoCo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mujoco-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: MuJoCo smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MuJoCo 4 and dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q demo.py motion.py vision.py camera_preview.py viewer_controls.py physical_grasp.py grasp_supervisor.py recovery.py robustness.py rgb_benchmark.py imitation.py vla tests

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile MuJoCo scene
        run: python demo.py --check-model

      - name: Exercise a full simulation cycle
        run: python demo.py --smoke-test

      - name: Verify real contact pickup and tray release
        run: python demo.py --physical-grasp --smoke-test

      - name: Force a soap drop and verify non-resetting automatic regrasp
        run: python tests/recovery_smoke.py

      - name: Install headless Mesa offscreen renderer (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libosmesa6-dev libgl1-mesa-dri

      - name: Install upstream reference SO-ARM100 MuJoCo workcell
        if: runner.os == 'Linux'
        run: |
          python -m pip install 'git+https://github.com/ahmedsohail2003/workcell-partA-imitation.git@5822ac1dd508c92183fd8ecc99f91d6ec386549b'

      - name: Render matching SO-101 front and wrist cameras and step joint motors
        if: runner.os == 'Linux'
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python vla/run_so101.py --check-env --seed 123

      - name: Install CPU LeRobot SmolVLA for one pretrained reference rollout (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.8.0' 'torchvision==0.23.0'
          python -m pip install 'lerobot[smolvla]==0.6.0'

      - name: Attempt one real pretrained SmolVLA pick and place in MuJoCo (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python vla/run_so101.py --episodes 1 --max-steps 240 --seed 123 \
            --device cpu --output vla_runs/so101_evaluation.json

      - name: Upload real pretrained SO-101 VLA physics evaluation
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: so101-pretrained-vla-rollout
          path: vla_runs/so101_evaluation.json
          if-no-files-found: error

      - name: Verify angled RGB camera regrasp with software rendering (Ubuntu)
        if: runner.os == 'Linux'
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python tests/visual_recovery_smoke.py

      - name: Benchmark matched randomized positions with and without recovery
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python robustness.py --trials 100 --seed 2026 --output robustness_report.json
          else
            python robustness.py --trials 8 --seed 2026 --output robustness_report.json
          fi

      - name: Save complete physical robustness results
        uses: actions/upload-artifact@v4
        with:
          name: robustness-${{ matrix.os }}
          path: robustness_report.json
          if-no-files-found: error

      - name: Benchmark 100 actual RGB soap locations and 24 shape/mass/yaw variations (Ubuntu)
        if: runner.os == 'Linux'
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python rgb_benchmark.py --trials 100 --stress-trials 24 --seed 2026 \
            --output rgb_robustness_report.json --verbose

      - name: Upload complete RGB robustness results
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rgb-robustness-ubuntu
          path: rgb_robustness_report.json
          if-no-files-found: error

      - name: Train a visual-conditioned behavioral cloning policy and score held-out physics (Ubuntu)
        if: runner.os == 'Linux'
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python imitation.py both --train-demos 24 --test-demos 12 \
            --seed 2026 --save-images --output-dir imitation_runs
          python -c "import json; r=json.load(open('imitation_runs/evaluation.json')); assert r['learned_successes'] > 0, 'Learned policy did not actually pick and place any held-out soap'"

      - name: Upload teacher demonstrations, learned policy and held-out results
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: earlybots-imitation-first-run
          path: imitation_runs/
          if-no-files-found: error

      - name: Boot headless WebViewer and exercise HTTP controls
        run: python tests/viewer_smoke.py
