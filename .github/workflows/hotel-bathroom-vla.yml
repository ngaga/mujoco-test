name: Hotel bathroom TidyBot Kinova VLA contract

on:
  pull_request:
    paths:
      - "mobile_demo/hotel_vla.py"
      - "mobile_demo/HOTEL_VLA.md"
      - "tests/test_hotel_vla.py"
      - ".github/workflows/hotel-bathroom-vla.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotel-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MuJoCo headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libosmesa6-dev libgl1-mesa-dri
          python -m pip install -r requirements.txt
      - name: Offline geometry and strict VLA action contract tests
        run: |
          python -m compileall -q mobile_demo/hotel_vla.py tests/test_hotel_vla.py
          python -m unittest discover -s tests -p 'test_hotel_vla.py' -v
      - name: Fetch SHA-verified official Stanford TidyBot meshes
        run: python -m mobile_demo.tidybot_full --fetch
      - name: Compile real robot and hotel bathroom with 3 cubes
        run: python -m mobile_demo.hotel_vla --check-model
      - name: Full 3-cube MuJoCo scripted physical rollout (NOT VLA inference)
        run: |
          python -m mobile_demo.hotel_vla --policy scripted --max-steps 2200 \
            --output mobile_runs/hotel_physical_smoke.json
      - name: Archive report even if physical trial fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-tidybot-kinova-smoke
          path: mobile_runs/hotel_physical_smoke.json
          if-no-files-found: warn
