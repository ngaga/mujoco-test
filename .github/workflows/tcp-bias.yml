name: SO-101 TCP calibration and jaw-offset experiment

on:
  pull_request:
    branches: [main]
    paths:
      - 'vla/tcp_bias.py'
      - 'vla/eval_tcp_bias.py'
      - 'tests/test_tcp_bias.py'
      - '.github/workflows/tcp-bias.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcp-bias:
    name: Paired pretrained SmolVLA arm-frame TCP bias
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MuJoCo SO-101 and software renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libosmesa6-dev libgl1-mesa-dri
          python -m pip install -r requirements.txt
          python -m pip install 'git+https://github.com/ahmedsohail2003/workcell-partA-imitation.git@5822ac1dd508c92183fd8ecc99f91d6ec386549b'

      - name: Regression tests for physical TCP frame and bounded corrections
        run: |
          python -m compileall -q vla/tcp_bias.py vla/eval_tcp_bias.py tests/test_tcp_bias.py
          python -m unittest discover -s tests -p 'test_tcp_bias.py' -v

      - name: Verify original MJCF jaw offsets and direction of predicted bias
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python vla/eval_tcp_bias.py --object cube --check-env
          python vla/eval_tcp_bias.py --object rectangle --check-env

      - name: Install real pretrained SmolVLA CPU inference
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.8.0' 'torchvision==0.23.0'
          python -m pip install 'lerobot[smolvla]==0.6.0'

      - name: Paired cube control and ±5mm jaw-axis offsets, 5 spawns each
        timeout-minutes: 20
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python vla/eval_tcp_bias.py --object cube --episodes 5 --seed 123 --device cpu \
            --output-dir vla_runs/tcp_bias_ablation/cube
          cat vla_runs/tcp_bias_ablation/cube/report.md

      - name: Paired rectangular soap control and ±5mm offsets, 3 spawns each
        timeout-minutes: 16
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: |
          python vla/eval_tcp_bias.py --object rectangle --episodes 3 --seed 123 --device cpu \
            --output-dir vla_runs/tcp_bias_ablation/rectangle
          cat vla_runs/tcp_bias_ablation/rectangle/report.md

      - name: Upload full comparison, real annotated GIFs and calibration vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: so101-tcp-jaw-frame-bias-and-contact-report
          path: vla_runs/tcp_bias_ablation/
          if-no-files-found: warn
